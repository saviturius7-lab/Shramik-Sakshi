<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Deep Forest Green Rounded Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#c29437" stroke-width="10" stroke-opacity="0.4"/>

  <!-- Golden Worker Hard Hat Motif -->
  <path d="M144 260 C144 170, 368 170, 368 260 Z" fill="url(#goldGrad)" stroke="#19231f" stroke-width="8"/>
  <rect x="120" y="252" width="272" height="26" rx="13" fill="url(#goldGrad)" stroke="#19231f" stroke-width="8"/>
  <rect x="236" y="160" width="40" height="96" rx="8" fill="#eab308" stroke="#19231f" stroke-width="6"/>

  <!-- Passbook Ledger with Rupee Symbol -->
  <rect x="176" y="296" width="160" height="130" rx="16" fill="#ffffff" stroke="#19231f" stroke-width="8"/>
  <line x1="200" y1="330" x2="312" y2="330" stroke="#1b4332" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Rupee Symbol -->
  <text x="256" y="398" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#1b4332" text-anchor="middle">₹</text>

  <!-- Checkmark Badge -->
  <circle cx="360" cy="380" r="38" fill="#22c55e" stroke="#ffffff" stroke-width="6"/>
  <path d="M344 380 L355 391 L378 368" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
